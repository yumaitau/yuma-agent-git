name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck -w worker

      - name: Build dashboard
        run: npm run build -w worker

      - name: Test
        run: npm test -w worker

      - name: Dashboard tests
        run: npm run test:ui -w worker

      - name: CLI tests (with real-git fast-import smoke)
        run: npm test -w yag
        env:
          YAG_GIT_SMOKE: '1'

      - name: API reference matches router
        run: |
          npm run docs:api -w worker
          git diff --exit-code docs/api.md

      - name: Commit-graph fuzzer (5 seeds)
        working-directory: worker
        run: npx vitest run test/fuzz
        env:
          VITE_FUZZ_SEED: '1,2,3,4,5'

      - name: Deploy dry-run
        run: npx wrangler deploy --dry-run --env prod --outdir dist -c worker/wrangler.jsonc

      - name: D1 migrations smoke
        run: npx wrangler d1 migrations list yag-db --local -c worker/wrangler.jsonc

      - name: No plaintext secrets in wrangler config
        run: |
          if grep -nE '(gh[ps]_|-----BEGIN)' worker/wrangler.jsonc; then
            echo 'secret-looking material found in wrangler.jsonc' >&2
            exit 1
          fi
